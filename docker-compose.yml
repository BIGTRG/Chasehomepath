# Local / self-hosted PostgreSQL for CHASE HomePath.
# Self-hosted, no managed cloud dependency (spec §11.2). Run on the dev box or Hetzner.
#
#   docker compose up -d db
#   npm run migrate
#
services:
  db:
    image: postgres:16
    container_name: chase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chase
      POSTGRES_PASSWORD: chase
      POSTGRES_DB: chase_homepath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chase -d chase_homepath"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

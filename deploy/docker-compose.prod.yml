# CHASE HomePath — production stack (server #1)
# Usage (from repo root on the server):
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
#
# `name:` pins the compose project. NEVER remove it: without it the project
# defaults to the directory name ("deploy"), which collides with other apps
# deployed from a deploy/ dir (myteslalife, geniuseye) — their `up` runs then
# remove chase-api/chase-web as orphans and take the site down (happened Aug 2026).
name: chasehomepath
services:
  db:
    image: postgres:16
    container_name: chase-postgres
    restart: unless-stopped
    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_USER: chase
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: chase_homepath
    volumes:
      - chase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chase -d chase_homepath"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: chase-api
    restart: unless-stopped
    logging: *default_logging
    env_file: ../.env
    environment:
      NODE_ENV: production
      PGHOST: db
      PGPORT: "5432"
      DATABASE_URL: postgres://chase:${PGPASSWORD}@db:5432/chase_homepath
      UPLOAD_DIR: /data/uploads
    volumes:
      - chase_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: chase-web
    restart: unless-stopped
    logging: *default_logging
    ports:
      - "8101:80"
    depends_on:
      - api

volumes:
  # Explicit names keep the pre-rename volumes (created under project "deploy").
  chase_pgdata:
    name: deploy_chase_pgdata
  chase_uploads:
    name: deploy_chase_uploads
